<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../output.css">
    <link rel="icon" href="../assets/game-store.png">
    <title>Logic Building</title>
</head>

<body>
    <div class="flex min-h-screen">
        <aside class="w-64 bg-white border-r p-6 hidden md:block">
            <h2 class="text-xl font-bold text-blue-600 mb-6">TechStore</h2>
            <p class="text-sm text-gray-500"></p>
            <div class="flex flex-col gap-2">

                <button id="btn1" class="bg-blue-500 text-white px-2 py-1 rounded-lg hover:cursor-pointer">All</button>
                <button id="btn2"
                    class="bg-blue-500 text-white px-2 py-1 rounded-lg hover:cursor-pointer">Mobile</button>
                <button id="btn3"
                    class="bg-blue-500 text-white px-2 py-1 rounded-lg hover:cursor-pointer">Laptop</button>
                <button id="btn4"
                    class="bg-blue-500 text-white px-2 py-1 rounded-lg hover:cursor-pointer">Accessories</button>
            </div>
        </aside>

        <main class="flex-1 bg-gray-100 text-gray-800">
            <!-- Top Navigation Bar -->
            <nav class="bg-white border-b border-gray-200 px-6 py-3 sticky top-0 z-50 shadow-sm">
                <div class="flex justify-between items-center">

                    <!-- Left: Brand Logo -->
                    <div class="flex items-center gap-2">
                        <span class="bg-blue-600 text-white font-bold px-2.5 py-1 rounded-lg text-lg">T</span>
                        <span class="text-xl font-extrabold text-gray-800 tracking-tight">TechStore</span>
                    </div>

                    <!-- Center: Search Bar -->
                    <div class="flex-1 max-w-md mx-6">
                        <input type="text" placeholder="Search iPhones, MacBooks, Accessories..."
                            class="w-full bg-gray-100 border border-gray-300 rounded-full py-2 px-5 text-sm focus:outline-none focus:bg-white focus:border-blue-500 transition">
                    </div>

                    <!-- Right: Navigation Links & Cart Counter -->
                    <div class="flex items-center gap-6 text-sm font-medium text-gray-600">
                        <a href="#" class="hover:text-blue-600 transition hidden sm:block">Home</a>
                        <a href="#" class="hover:text-blue-600 transition hidden sm:block">Deals</a>

                        <!-- Cart Badge -->
                        <div
                            class="relative bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5">
                            <span>🛒 Cart</span>
                            <span id="cartCount"
                                class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
                        </div>
                    </div>

                </div>
            </nav>

            <div class="mx-6 mb-8 rounded-2xl overflow-hidden shadow-md relative h-56 bg-gray-900">
                <img id="heroImage" src="../assets/" alt="Banner"
                    class="w-full h-full object-cover opacity-80 transition-all duration-500">

                <div
                    class="absolute inset-0 flex flex-col justify-center px-8 text-white bg-gradient-to-r from-black/70 to-transparent">
                    <h1 class="text-3xl font-bold mb-2">Upgrade Your Tech Gear</h1>
                    <p class="text-sm text-gray-200">Best deals on iPhones, MacBooks, and Accessories.</p>
                </div>
            </div>
            <div id="productContainer"></div>
        </main>

        <!-- Right Aside (Live Cart) -->
        <aside class="w-72 bg-white border-l p-6 hidden lg:flex flex-col justify-between">
            <div>
                <h3 class="text-lg font-bold text-gray-800 border-b pb-3 mb-4">Your Cart 🛒</h3>

                <!-- Yahan selected items JS se add honge -->
                <div id="cartItems" class="space-y-3 text-sm">
                    <p class="text-gray-400">Your cart is empty.</p>
                </div>
            </div>

            <!-- Total Price Section -->
            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between font-bold text-gray-800 text-base mb-4">
                    <span>Total:</span>
                    <span id="totalPrice">Rs. 0</span>
                </div>
                <button id="clearCart"
                    class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg text-sm font-semibold transition">
                    Clear Cart
                </button>
            </div>
        </aside>

    </div>

    <script src="web.js"></script>
</body>

</html>
