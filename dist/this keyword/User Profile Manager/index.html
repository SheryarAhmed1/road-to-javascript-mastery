<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information Form</title>
    <link rel="stylesheet" href="../../output.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Form Container -->
    <div class="flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">User Details</h2>
            <form id="userForm" class="space-y-4" autocomplete="off">

                <!-- Name Field -->
                <div>
                    <label for="userName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="userName" name="name" placeholder="Enter your name" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Email Field (New) -->
                <div>
                    <label for="userEmail" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="userEmail" name="email" placeholder="example@domain.com" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                    <!-- City Field -->
                    <div>
                        <label for="userCity" class="block text-sm font-medium text-gray-700 mb-1">City</label>
                        <input type="text" id="userCity" name="city" placeholder="City" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                <!-- </div> -->

                <!-- Profession Field -->
                <div>
                    <label for="userProfession" class="block text-sm font-medium text-gray-700 mb-1">Profession</label>
                    <input type="text" id="userProfession" name="profession"
                        placeholder="e.g. Software Engineer, Teacher" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Profile Picture URL Field (New) -->
                <div>
                    <label for="userProfilePic" class="block text-sm font-medium text-gray-700 mb-1">Profile Picture
                        URL</label>
                    <input type="url" id="userProfilePic" name="profilePic" placeholder="https://example.com/photo.jpg"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Banner URL Field (New) -->
                <div>
                    <label for="userBanner" class="block text-sm font-medium text-gray-700 mb-1">Banner Image
                        URL</label>
                    <input type="url" id="userBanner" name="banner" placeholder="https://example.com/banner.jpg"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="w-full bg-blue-600 text-white font-semibold py-2.5 px-4 rounded-lg hover:bg-blue-700 transition duration-200 mt-2 cursor-pointer">
                    Submit
                </button>

            </form>
        </div>
    </div>

    <!-- Cards Container -->
    <div id="cardsContainer" class="flex flex-wrap justify-center gap-6 p-6"></div>

    <script src="script.js"></script>
</body>

</html>
