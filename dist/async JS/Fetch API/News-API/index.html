<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest News Updates</title>
    <link rel="icon" href="../../../assets/world-news.png">
     <link rel="stylesheet" href="../../../output.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header Section -->
    <header class="bg-blue-600 text-white py-6 shadow-md">
        <div class="max-w-7xl mx-auto px-4">
            <h1 class="text-3xl font-bold tracking-tight">Latest News Updates</h1>
            <p class="text-blue-100 mt-1">Stay informed with real-time headlines</p>
        </div>
    </header>

    <!-- Main News Grid Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- News cards will be injected here by JavaScript -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
