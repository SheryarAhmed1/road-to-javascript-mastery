<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyPulse — Global News Hub</title>
    <link rel="stylesheet" href="../../output.css">
    <link rel="icon" href="../../assets/DailyPlus Global News Logo.png">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Sticky Glass Navbar -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Brand Logo -->
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-indigo-200">
                    <img src="../../assets/DailyPlus Global News Logo.png" alt="" class="rounded-xl">
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-slate-900">Daily<span class="text-indigo-600">Pulse</span></h1>
                    <p class="text-[11px] text-slate-500 font-medium -mt-1">LIVE GLOBAL HEADLINES</p>
                </div>
            </div>

            <!-- Dynamic Search Form -->
            <form id="search-form" class="flex w-full md:w-96 relative">
                <input 
                    autocomplete="off"
                    type="text" 
                    id="search-input" 
                    placeholder="Search topics (e.g. AI, Cricket, SpaceX)..." 
                    class="w-full pl-4 pr-24 py-2.5 bg-slate-100 border border-slate-200 rounded-full text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                >
                <button 
                    type="submit" 
                    class="absolute right-1.5 top-1.5 bottom-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 rounded-full transition cursor-pointer shadow-sm">
                    Search
                </button>
            </form>
        </div>

        <!-- Quick Category Pills -->
        <div class="border-t border-slate-100 bg-slate-50/50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 flex items-center gap-2 overflow-x-auto no-scrollbar">
                <span class="text-xs font-semibold text-slate-400 uppercase mr-1">Trending:</span>
                <button class="category-btn px-3.5 py-1 rounded-full text-xs font-medium bg-indigo-600 text-white transition cursor-pointer" data-topic="Technology">Technology</button>
                <button class="category-btn px-3.5 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-indigo-500 hover:text-indigo-600 transition cursor-pointer" data-topic="Artificial Intelligence">AI</button>
                <button class="category-btn px-3.5 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-indigo-500 hover:text-indigo-600 transition cursor-pointer" data-topic="Business">Business</button>
                <button class="category-btn px-3.5 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-indigo-500 hover:text-indigo-600 transition cursor-pointer" data-topic="Science">Science</button>
                <button class="category-btn px-3.5 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-indigo-500 hover:text-indigo-600 transition cursor-pointer" data-topic="Cricket">Cricket</button>
                <button class="category-btn px-3.5 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-indigo-500 hover:text-indigo-600 transition cursor-pointer" data-topic="SpaceX">Space</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        
        <!-- Current Topic Heading -->
        <div class="flex items-center justify-between mb-6">
            <h2 id="topic-heading" class="text-2xl font-bold text-slate-800">Top Stories in <span class="text-indigo-600">Technology</span></h2>
            <span id="results-count" class="text-xs font-medium text-slate-500 bg-slate-200/70 px-3 py-1 rounded-full"></span>
        </div>

        <!-- Cards Grid -->
        <div id="card-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-7">
            <!-- Dynamic Cards Inject Here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
            Built with Async JavaScript & Tailwind CSS • Powered by NewsAPI
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
