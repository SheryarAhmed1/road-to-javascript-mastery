<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Profile Card Generator</title>
    <link rel="icon" href="../../assets/js.png">
    <link rel="stylesheet" href="../../output.css">
</head>
<body>
    <h1 class="text-center text-5xl font-sans pt-10">Cardify</h1>
    <p class="text-center font-sans text-md pt-3">Generate profile Card</p>
    <form action="" class="bg-slate-900 text-white p-8 rounded-2xl shadow-lg w-80 sm:w-96 m-auto mt-10 flex flex-col gap-4">

        <label for="">Profile image url</label>
        <input type="text" placeholder="profile pic"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">

        <label for="">Name</label>
        <input type="text" placeholder="name"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">

        <label for="">Occupation</label>
        <input type="text" placeholder="occupation"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">

        <label for="">Bio</label>
        <input type="text" placeholder="bio"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">

        <input type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-3 rounded-lg shadow-md shadow-indigo-600/20 active:scale-[0.98] transition-all cursor-pointer mt-2">
    </form>

    <script src="script.js"></script>
</body>
</html>
