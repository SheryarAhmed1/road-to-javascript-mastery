<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Toggler</title>
    <link rel="stylesheet" href="../../output.css">
</head>

<body class="font-serif h-64 w-full">
    <div class="flex justify-center items-center mt-10">

        <div class="flex flex-col justify-center items-center w-64 h-96 rounded-2xl bg-gradient-to-r from-blue-500 to-emerald-500 ">
            
        <h1 id="countDisplay" class="font-bold text-2xl">0</h1>
        <h1>Click Counter</h1>
        <button id="plusBtn" class="bg-blue-500 text-white px-3 py-1 rounded-md m-10 font-bold cursor-pointer hover:bg-blue-400 ">Add Count</button>
        <button id="resetBtn" class="bg-red-500 text-white px-3 py-1 rounded-md  font-bold cursor-pointer hover:bg-red-700 ">Reset</button>
        
    </div>
</div>

    <script src="index.js"></script>
</body>

</html>
