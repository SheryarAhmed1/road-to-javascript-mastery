<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevPad — Smart Scratchpad</title>
  <link rel="stylesheet" href="../../output.css">
  <link rel="icon" href="../../assets/note.png">
</head>
<body class="bg-sky-50/70 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Top Navigation Bar -->
  <nav class="bg-white border-b border-indigo-100 px-6 py-3.5 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      
      <!-- Brand Logo & Name -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-500 text-white flex items-center justify-center font-bold text-lg shadow-sm">
          D
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-800 leading-tight">DevPad</h1>
          <p class="text-[11px] text-indigo-500 font-medium">Personal Scratchpad</p>
        </div>
      </div>

      <!-- Right Nav Pills -->
      <div class="flex items-center gap-2.5">
        <span class="hidden sm:inline-flex items-center gap-1.5 text-xs font-medium text-amber-700 bg-amber-100/80 px-3 py-1.5 rounded-full">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span>
          Draft Mode
        </span>
        <span class="inline-flex items-center gap-1.5 text-xs font-medium text-emerald-700 bg-emerald-100/80 px-3 py-1.5 rounded-full">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          Auto-Saved
        </span>
      </div>

    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-8">
    <div class="w-full max-w-3xl bg-white rounded-3xl border-2 border-indigo-100 shadow-sm overflow-hidden">
      
      <!-- Colorful Top Strip inside Card -->
      <div class="bg-violet-50/80 px-6 py-3.5 border-b border-indigo-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-rose-400"></span>
          <span class="w-3 h-3 rounded-full bg-amber-400"></span>
          <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
          <span class="ml-2 text-xs font-semibold text-violet-700">Quick Note.txt</span>
        </div>
        <span class="text-xs font-medium text-indigo-500">localStorage Active</span>
      </div>

      <!-- Writing Area -->
      <textarea 
        id="noteArea" 
        placeholder="Write your ideas, code snippets, or daily tasks here..." 
        class="w-full h-80 bg-white text-slate-700 placeholder-slate-400 p-6 sm:p-8 text-base leading-relaxed focus:outline-none resize-none"
      ></textarea>

      <!-- Colorful Bottom Action & Stats Bar -->
      <div class="px-6 py-4 bg-amber-50/60 border-t border-amber-100 flex flex-wrap items-center justify-between gap-4">
        
        <!-- Clear Button -->
        <button class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-semibold px-4 py-2 rounded-xl text-xs transition cursor-pointer">
          Clear Note
        </button>

        <!-- Font Size -->
         <button id="fontSize" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-semibold px-4 py-2 rounded-xl text-xs transition cursor-pointer">
          Bold Font
        </button>

        <!-- Colored Stat Badges -->
        <div class="flex items-center gap-2.5 text-xs font-semibold">
          <p id="wordCount" class="bg-sky-100 text-sky-700 px-3.5 py-1.5 rounded-xl">Words: 0</p>
          <p id="charCount" class="bg-emerald-100 text-emerald-700 px-3.5 py-1.5 rounded-xl">Characters: 0</p>
        </div>

      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
