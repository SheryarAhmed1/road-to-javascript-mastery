<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloading Card</title>
  <link rel="stylesheet" href="../output.css">
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4 relative overflow-hidden antialiased selection:bg-indigo-500 selection:text-white font-serif ">
  <!-- Ambient Background Glows -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 size-112 bg-indigo-600/20 rounded-full blur-[110px] pointer-events-none"></div>
  <div class="absolute top-1/3 left-1/3 -translate-x-1/2 -translate-y-1/2 size-72 bg-cyan-500/15 rounded-full blur-[90px] pointer-events-none"></div>

  <!-- Main Card -->
  <div class="relative w-full max-w-md bg-slate-900/75 backdrop-blur-2xl p-8 rounded-3xl border border-slate-800/80 shadow-[0_20px_50px_rgba(0,0,0,0.6)]">
    
    <!-- Top Subtle Accent Line -->
    <div class="absolute inset-x-10 top-0 h-px bg-linear-to-r from-transparent via-indigo-400/50 to-transparent"></div>

    <!-- Header Section -->
    <div class="flex items-center gap-3 mb-6">
      <span class="relative flex size-3 shrink-0">
        <span class="animate-ping absolute inline-flex size-full rounded-full bg-cyan-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full size-3 bg-cyan-500"></span>
      </span>
      
      <!-- Top Text (Same ID & Tag) -->
      <p id="text" class="text-slate-100 font-semibold text-lg tracking-tight">
        Downloading...
      </p>
    </div>

    <!-- Progress Bar Background -->
    <div class="w-full bg-slate-950/90 rounded-full h-3.5 p-0.5 border border-slate-800/90 shadow-inner overflow-hidden">
      <!-- Inner Progress Div (Same ID & Tag) -->
      <div id="progress" class="bg-linear-to-r from-indigo-500 via-blue-500 to-cyan-400 h-full rounded-full transition-all duration-300 ease-out shadow-[0_0_15px_rgba(56,189,248,0.6)]" style="width: 0%;"></div>
    </div>

    <!-- Footer Section -->
    <div class="flex items-center justify-between mt-4 pt-3 border-t border-slate-800/60">
      <span class="text-xs font-medium uppercase tracking-widest text-slate-500">
        Transfer Progress
      </span>
      <!-- Bottom Percentage Text (Same ID & Tag) -->
      <p id="percentage" class="text-sm font-bold font-mono text-cyan-400 tracking-wider">
        0%
      </p>
      <div>
        <button class="bg-blue-600 cursor-pointer hover:bg-blue-700 px-3 py-1 font-serif rounded-2xl">Transfer Data</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
